name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
      - update-ci
  pull_request:
    branches:
      - main
      - develop
      - update-ci

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          mkdir -p Sources
          echo "$GOOGLE_SERVICE_PLIST" > Sources/GoogleService-Info.plist

      - name: Build and Test
        run: |
          xcodebuild test -verbose \
            -project MediStock.xcodeproj \
            -scheme MediStock \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.1' \
            -resultBundlePath ./TestResults/TestResults.xcresult \
            -skipPackagePluginValidation

      - name: Debug - List files in TestResults directory
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in TestResults directory:"
          ls -la TestResults || echo "TestResults directory not found"
        if: always()

      - name: Check permissions of TestResults
        run: |
          ls -la ./TestResults
          ls -la ./TestResults/TestResults.xcresult
        if: always()

      - name: Export Test Diagnostics
        run: |
          xcrun xcresulttool export --legacy --path ./TestResults/TestResults.xcresult --output-path ./TestResults/diagnostics --type diagnostics
        if: always()

      - name: Generate Code Coverage Report
        run: |
          xcrun xccov view --report --only-targets ./TestResults/TestResults.xcresult > ./TestResults/coverage.html
        if: always()

      - name: Export Test Results to JSON
        run: |
          xcrun xcresulttool get --legacy --format json --path ./TestResults/TestResults.xcresult > ./TestResults/test-results.json
        if: always()

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/TestResults.xcresult
        if: always()

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/coverage.html
        if: always()

      - name: Upload Test Results JSON
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: ./TestResults/test-results.json
        if: always()