name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
      - update-ci
  pull_request:
    branches:
      - main
      - develop
      - update-ci

jobs:
  build-and-test:
    runs-on: macos-14-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          mkdir -p Sources
          echo "$GOOGLE_SERVICE_PLIST" > Sources/GoogleService-Info.plist

      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: MediStock.xcodeproj
          scheme: MediStock
          destination: 'platform=iOS Simulator,name=iPhone 16 Pro'
          action: test
          result-bundle-path: './TestResults/TestResults.xcresult'
          skip-package-plugin-validation: true

      - name: Debug - List files in TestResults directory
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in TestResults directory:"
          ls -la TestResults || echo "TestResults directory not found"
          if [ -d ./TestResults/TestResults.xcresult ]; then
            echo "xcresult directory exists"
            ls -lh ./TestResults/TestResults.xcresult
          else
            echo "xcresult directory not found"
          fi
        if: always()

      - name: Check xcresulttool Version and Try Direct Command
        run: |
          echo "Checking xcresulttool version..."
          xcrun xcresulttool version || echo "Failed to get xcresulttool version"
          
          echo "Trying direct xcrun command with verbose output..."
          xcrun xcresulttool get --path ./TestResults/TestResults.xcresult --format json > test_summary.json 2>xcrun_error.log || {
            echo "Command failed with exit code $?"
            echo "Error output:"
            cat xcrun_error.log
          }
          
          ls -la test_summary.json || echo "Failed to create test_summary.json"
        if: always()
        continue-on-error: true

      - name: Process Test Results
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ./TestResults/TestResults.xcresult
          token: ${{ secrets.GITHUB_TOKEN }}
          upload-bundles: 'never'
        if: always()
        continue-on-error: true

      - name: Process Test Results (Alternative Methods)
        run: |
          echo "Extracting test results using alternative methods..."
          
          # Create a directory for the extracted results
          mkdir -p extracted_results
          
          # Try using xccov to get code coverage
          echo "Trying xccov for code coverage..."
          xcrun xccov view --report ./TestResults/TestResults.xcresult > extracted_results/coverage_report.txt 2>xccov_error.log || {
            echo "xccov command failed with exit code $?"
            echo "Error output:"
            cat xccov_error.log
          }
          
          # Try using xcrun with different options
          echo "Trying xcrun with different options..."
          xcrun xcresulttool formatDescription --path ./TestResults/TestResults.xcresult > extracted_results/format_description.txt 2>/dev/null || echo "formatDescription failed"
          
          # Try listing actions
          echo "Trying to list actions..."
          xcrun xcresulttool actions --path ./TestResults/TestResults.xcresult > extracted_results/actions.txt 2>/dev/null || echo "actions command failed"
          
          # Try a simpler approach - just check if the bundle exists and has content
          echo "Basic bundle information:" > extracted_results/basic_info.txt
          ls -la ./TestResults/TestResults.xcresult >> extracted_results/basic_info.txt
          find ./TestResults/TestResults.xcresult -type f | head -n 20 >> extracted_results/basic_info.txt
          
          # Print some information
          echo "Extraction results:"
          ls -la extracted_results/
          echo "Basic info preview:"
          head -n 10 extracted_results/basic_info.txt
        if: always()
        continue-on-error: true

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./TestResults/TestResults.xcresult
            ./extracted_results
        if: always()
