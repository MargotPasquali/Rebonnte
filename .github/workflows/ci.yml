name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
      - update-ci
  pull_request:
    branches:
      - main
      - develop
      - update-ci

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          mkdir -p Sources
          echo "$GOOGLE_SERVICE_PLIST" > Sources/GoogleService-Info.plist

      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: MediStock.xcodeproj
          scheme: MediStock
          destination: 'platform=iOS Simulator,name=iPhone 16 Pro'
          action: test
          result-bundle-path: './TestResults/TestResults.xcresult'
          skip-package-plugin-validation: true

      - name: Debug - List files in TestResults directory
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in TestResults directory:"
          ls -la TestResults || echo "TestResults directory not found"
          if [ -d ./TestResults/TestResults.xcresult ]; then
            echo "xcresult directory exists"
            ls -lh ./TestResults/TestResults.xcresult
          else
            echo "xcresult directory not found"
          fi
        if: always()

      - name: Try Direct xcrun Command
        run: |
          echo "Trying direct xcrun command..."
          xcrun xcresulttool get --path ./TestResults/TestResults.xcresult --format json > test_summary.json
          ls -la test_summary.json || echo "Failed to create test_summary.json"
        if: always()
        continue-on-error: true

      - name: Process Test Results (Option 1)
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ./TestResults/TestResults.xcresult
          token: ${{ secrets.GITHUB_TOKEN }}
          upload-bundles: 'never'
        if: always()
        continue-on-error: true
        
      - name: Process Test Results (Option 2)
        uses: wix/xcresult-action@v1
        with:
          path: ./TestResults/TestResults.xcresult
        if: always()
        continue-on-error: true

      - name: Process Test Results (Option 3 - Custom Script)
        run: |
          echo "Extracting test results using custom script..."
          
          # Create a directory for the extracted results
          mkdir -p extracted_results
          
          # Get the test summary
          xcrun xcresulttool get --path ./TestResults/TestResults.xcresult --format json > extracted_results/summary.json
          
          # Extract basic test information
          echo "Test Summary:" > extracted_results/test_report.txt
          xcrun xcresulttool get --path ./TestResults/TestResults.xcresult --format json | grep -E "identifier|name|status" | head -n 50 >> extracted_results/test_report.txt
          
          # Print the first few lines of the report
          echo "Test Report Preview:"
          head -n 20 extracted_results/test_report.txt
        if: always()
        continue-on-error: true

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./TestResults/TestResults.xcresult
            ./extracted_results
        if: always()
