# Updated workflow to debug xcrun exit code 64, ensure Xcode 16 compatibility for Swift Testing
name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
      - update-ci
  pull_request:
    branches:
      - main
      - develop
      - update-ci

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: List available Xcode versions
        run: ls -la /Applications/Xcode*

      - name: List available simulators
        run: xcrun simctl list devices

      - name: List project information
        run: xcodebuild -list -project MediStock.xcodeproj

      - name: Debug - List project files
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in MediStock.xcodeproj directory:"
          ls -la MediStock.xcodeproj || echo "MediStock.xcodeproj directory not found"

      - name: Debug - Verify directory structure
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in Sources directory:"
          ls -la Sources || echo "Sources directory not found"

      - name: Clean build directory
        run: xcodebuild clean -project MediStock.xcodeproj -scheme MediStock

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          mkdir -p Sources
          echo "$GOOGLE_SERVICE_PLIST" > Sources/GoogleService-Info.plist

      - name: Build and Test
        run: |
          xcodebuild test -verbose \
            -project MediStock.xcodeproj \
            -scheme MediStock \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath ./TestResults/TestResults.xcresult \
            -skipPackagePluginValidation

      - name: Debug - List files in TestResults directory
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in TestResults directory:"
          ls -la TestResults || echo "TestResults directory not found"
        if: always()

      - name: Process Test Results
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ./TestResults/TestResults.xcresult
          upload-bundles: 'never'
        if: always()

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/TestResults.xcresult
        if: always()