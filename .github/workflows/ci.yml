name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
      - update-ci
  pull_request:
    branches:
      - main
      - develop
      - update-ci

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set Xcode path
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: List Xcode versions
        run: ls /Applications | grep Xcode

      - name: List available simulators
        run: xcrun simctl list devices

      - name: Test xcresulttool
        run: xcrun xcresulttool version

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          mkdir -p Sources
          echo "$GOOGLE_SERVICE_PLIST" > Sources/GoogleService-Info.plist

      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: MediStock.xcodeproj
          scheme: MediStock
          destination: 'platform=iOS Simulator,name=iPhone 16,OS=18.1'
          action: test
          result-bundle-path: './TestResults/TestResults.xcresult'
          skip-package-plugin-validation: true

      - name: Debug - List files in TestResults directory
        run: |
          echo "Listing files in the workspace:"
          ls -la .
          echo "Listing files in TestResults directory:"
          ls -la TestResults || echo "TestResults directory not found"
          if [ -f ./TestResults/TestResults.xcresult ]; then
            echo "xcresult file exists"
            ls -lh ./TestResults/TestResults.xcresult
          else
            echo "xcresult file not found"
          fi
        if: always()

      - name: Validate xcresult file
        run: xcrun xcresulttool get --path ./TestResults/TestResults.xcresult --format json > /dev/null || echo "Invalid xcresult file"
        if: always()

      - name: Process Test Results
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ./TestResults/TestResults.xcresult
          title: "MediStock Test Results"
          show-passed-tests: true
          show-code-coverage: true
        if: success() && always()

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/TestResults.xcresult
        if: always()